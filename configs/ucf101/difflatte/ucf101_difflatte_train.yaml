# dataset
dataset: "ucf101"

data_path: "/scratch/s224075134/temporal_diffusion/datasets/video/ucf101/preprocessed_256_mp4"
latent_path: "/scratch/s224075134/temporal_diffusion/datasets/video/ucf101_latent_32_kl_f8_autoencoder/video"
load_latent: True
vae: "configs/vae/autoencoder_kl.yaml"

# save and load
results_dir: "./results"
pretrained:

# model config: 
model: DiffLatte-XL/2
num_frames: 16
image_size: 256 # choices=[256, 512]
in_channels: 4
num_sampling_steps: 250
frame_interval: 1
