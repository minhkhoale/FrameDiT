pretrained_model_path: maxin-cn/Latte-1
pretrained: results_t2v/multiple512/000-FrameDiTHT2V-XL-256-2-1-2-concat-F16S1-multiple512-lora-r32-alpha32-ImageNetPretrained-Gc-Amp-512-loadlatent/checkpoints/0027500.pt
# model config: 
model: FrameDiTHT2V-XL/256-2-1-2-concat

use_lora: True
lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.00
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"


num_frames: 16
video_length: 16
image_size: [512, 512] # choices=[256, 512]
in_channels: 4
num_sampling_steps: 50
frame_interval: 1
#fixed_spatial: False
#attention_bias: True
learn_sigma: True
#extras: 2 # [1, 2] 1 unconditional generation, 2 class-conditional generation
attention_mode: math
resume_from_checkpoint:

# low VRAM and speed up training
use_compile: True
mixed_precision_16bit: True
mixed_precision: False
enable_xformers_memory_efficient_attention: False
gradient_checkpointing: True

beta_start: 0.0001
beta_end: 0.02
beta_schedule: "linear"
variance_type: "learned_range"
seed: 2
run_time: 0
guidance_scale: 7.5
sample_method: 'DDIM'
save_img_path: "./sample_videos/t2v-multiple/framedith_concat_lora"
# save_img_path: "./sample_videos/t2v/lattet2v"
enable_vae_temporal_decoder: False
enable_temporal_attentions: True # LatteT2V-V0: set to False; LatteT2V-V1: set to True
text_prompt: [
              'a bird and a cat',
              'a cat and a dog',
              'a dog and a horse',
              'a horse and a sheep',
              'a sheep and a cow',
              'a cow and an elephant',
              'an elephant and a bear',
              'a bear and a zebra',
              'a zebra and a giraffe',
              'a giraffe and a bird',
              'a chair and a couch',
              'a couch and a potted plant',
              'a potted plant and a tv',
              'a tv and a laptop',
              'a laptop and a remote',
              'a remote and a keyboard'
              ]