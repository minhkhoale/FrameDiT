# dataset
dataset: "ucf101"

data_path: /scratch/s224075134/temporal_diffusion/datasets/video/ucf101_latent_16_kl_f8_autoencoder_bilinear_flip
load_latent: True
vae: "configs/vae/autoencoder_kl.yaml"

# save and load
results_dir: "./results_adaptive_schedule"
pretrained:
experiment_suffix: "equalsnr_channelwise_calibrated"

# model config:
model: MatLatte-B/64-256/2
num_frames: 16
image_size: 128
in_channels: 4
num_sampling_steps: 250
frame_interval: 3
fixed_spatial: False
attention_bias: True
learn_sigma: False
predict_xstart: True
extras: 2

# EqualSNR Fourier baseline with channel-aware C and average-SNR calibration
diffusion_name: gaussian_diffusion
equal_snr: True
equal_snr_power_path: results_adaptive_schedule/ucf101128/adaptive_frequency_power/dataset_prior_frequency_stats_channelwise.npz
equal_snr_power_scale: 0.0331786225
equal_snr_power_exponent: 2.0
equal_snr_calibrate_schedule: True

# train config:
save_ceph: True
learning_rate: 1e-4
ckpt_every: 10000
clip_max_norm: 0.1
start_clip_iter: 100000
local_batch_size: 8
max_train_steps: 500000
global_seed: 3407
num_workers: 8
log_every: 50
lr_warmup_steps: 0
resume_from_checkpoint:
gradient_accumulation_steps: 1
num_classes: 101

# low VRAM and speed up training
use_compile: True
mixed_precision: True
enable_xformers_memory_efficient_attention: False
gradient_checkpointing: False

project: adaptive_frequency_scheduler
