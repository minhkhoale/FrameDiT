# dataset
dataset: "ucf101"

data_path: /scratch/s224075134/temporal_diffusion/datasets/video/ucf101_latent_32_kl_f8_autoencoder_bilinear_flip
load_latent: True
vae: "configs/vae/autoencoder_kl.yaml"

# save and load
results_dir: "./results_adaptive_schedule"
pretrained:

# model config:
model: MatLatte-M/64-256/2
num_frames: 16
image_size: 256 # choices=[256, 512]
in_channels: 4
num_sampling_steps: 250
noise_schedule: cosine
frame_interval: 3
fixed_spatial: False
attention_bias: True
learn_sigma: False
extras: 2 # [1, 2] 1 unconditional generation, 2 class-conditional generation

# adaptive frequency schedule
adaptive_frequency: True
adaptive_frequency_gamma: 1.0
adaptive_frequency_learnable_gamma: False
adaptive_frequency_power_path: results_adaptive_schedule/ucf101256/adaptive_frequency_power/dataset_prior_frequency_stats.npz
adaptive_frequency_power_exponent:
adaptive_frequency_num_temporal_bands: 4
adaptive_frequency_num_spatial_bands: 12

# train config:
save_ceph: True # important
learning_rate: 1e-4
ckpt_every: 10000
clip_max_norm: 0.1
start_clip_iter: 100000
local_batch_size: 16 # important
max_train_steps: 500000
global_seed: 3407
num_workers: 8
log_every: 50
lr_warmup_steps: 0
resume_from_checkpoint:
gradient_accumulation_steps: 1 # TODO
num_classes: 101

# low VRAM and speed up training
use_compile: True
mixed_precision: True
enable_xformers_memory_efficient_attention: False
gradient_checkpointing: False

project: adaptive_frequency_scheduler
