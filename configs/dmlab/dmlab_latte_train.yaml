# dataset
dataset: "dmlab"

data_path: 
latent_path: /scratch/s224075134/temporal_diffusion/datasets/video/dmlab_latent_8_17035ae5/training
action_path: /scratch/s224075134/temporal_diffusion/datasets/video/dmlab/training
load_latent: True

vae: "./configs/vae/dmlab_dc_ae.yaml"

# save and load
results_dir: "./results"
pretrained: 

# model config: 
model: LatteV2-B/1
num_frames: 16
image_size: 64 # choices=[256, 512]
in_channels: 32
num_sampling_steps: 250
frame_interval: 1
fixed_spatial: False
attention_bias: True
learn_sigma: False
extras: 3 # [1, 2, 3] 1 unconditional generation, 2 class-conditional generation, 3 action-conditional generation
num_classes: 4

# train config:
load_from_ceph: False # important
learning_rate: 1e-4
ckpt_every: 10000
clip_max_norm: 0.1
start_clip_iter: 100000
local_batch_size: 8 # important
max_train_steps: 500000
global_seed: 3407
num_workers: 8
log_every: 50
lr_warmup_steps: 0
resume_from_checkpoint:
gradient_accumulation_steps: 1 # TODO

# low VRAM and speed up training TODO
use_compile: True
mixed_precision: False
mixed_precision_16bit: True
enable_xformers_memory_efficient_attention: False
gradient_checkpointing: False

# Wandb logger
project: temporal-noise