# dataset
dataset: "pexels"
load_latent: False

# save and load
results_dir: "./results_t2v"
pretrained_latte: maxin-cn/Latte-1 # LatteT2V ckpt
pretrained:

vae: "./configs/vae/lattet2v_autoencoder_kl.yaml"
tokenizer: "./configs/tokenizer/t5.yaml"

use_lora: False
lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.00
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"

# model config: 
model: FrameDiTHT2V-XL/256-2-1-2-concat
num_frames: 16
video_length: 16
image_size: 512 # choices=[256, 512]
in_channels: 4
num_sampling_steps: 50
frame_interval: 1
learn_sigma: True
resume_from_checkpoint:

# train config:
learning_rate: 3e-4
lr_warmup_steps: 10000
local_batch_size: 1 # important
gradient_accumulation_steps: 8 # TODO
max_train_steps: 800000
ckpt_every: 5000
log_every: 25

weight_decay: 1e-4
clip_max_norm: 1.0
start_clip_iter: 0

num_workers: 2
offload_vae: True
offload_ema: False
ema_update_every: 4

# low VRAM and speed up training
use_compile: True
mixed_precision: bf16
enable_xformers_memory_efficient_attention: False
gradient_checkpointing: False
n_checkpointing_blocks: 14

global_seed: 0

project: # wandb project name for logging