# dataset
dataset: "kinetics600"

data_path: "/scratch/s224075134/temporal_diffusion/datasets/video/kinetics600/train"
metadata_dir: "/scratch/s224075134/temporal_diffusion/datasets/video/kinetics600/metadata"
annotation_path: "/scratch/s224075134/temporal_diffusion/datasets/video/kinetics600/annotations/train.csv"
load_latent: False
vae: "configs/vae/video_vae.yaml"

# save and load
results_dir: "./results"
pretrained: 

# model config: 
model: FusedMatLatte-XL/128-512/2-concat
num_frames: 17
image_size: 128 # choices=[256, 512]
in_channels: 16
num_sampling_steps: 250
frame_interval: 3
fixed_spatial: False
attention_bias: True
learn_sigma: True
extras: 2 # [1, 2] 1 unconditional generation, 2 class-conditional generation
attention_mode: flash

# train config:
save_ceph: True # important
learning_rate: 1e-4
ckpt_every: 10000
clip_max_norm: 0.1
start_clip_iter: 100000
local_batch_size: 8 # important
max_train_steps: 1000000
global_seed: 3407
num_workers: 8
log_every: 50
lr_warmup_steps: 0
resume_from_checkpoint:
gradient_accumulation_steps: 2 # TODO
num_classes: 600

# low VRAM and speed up training
use_compile: True
mixed_precision_16bit: True
mixed_precision: False
enable_xformers_memory_efficient_attention: False
gradient_checkpointing: False

project: 