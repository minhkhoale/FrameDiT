# dataset
dataset: "bair"
data_path: "/scratch/s224075134/temporal_diffusion/datasets/video/bair/softmotion30_44k/train/video_aux1"
latent_path: "/scratch/s224075134/temporal_diffusion/datasets/video/bair_latent_8_dc_ae/softmotion30_44k/train/video_aux1"
load_latent: True
vae: "./configs/vae/bair_dc_ae.yaml"

# save and load
results_dir: "./results_adaptive_schedule"
pretrained:

# model config:
model: Latte-B/2
num_frames: 16
image_size: 64
in_channels: 32
num_sampling_steps: 250
frame_interval: 1
fixed_spatial: False
attention_bias: True
learn_sigma: True
extras: 1
num_classes:

# adaptive frequency schedule
adaptive_frequency: True
adaptive_frequency_gamma: 0.5
adaptive_frequency_learnable_gamma: True
adaptive_frequency_gamma_mode: timestep
adaptive_frequency_power_path: results_adaptive_schedule/bair64/adaptive_frequency_power/dataset_prior_frequency_stats.npz
adaptive_frequency_power_exponent: 2.0
adaptive_frequency_num_temporal_bands: 4
adaptive_frequency_num_spatial_bands: 8

# train config:
load_from_ceph: False
learning_rate: 1e-4
ckpt_every: 10000
clip_max_norm: 0.1
start_clip_iter: 50000
local_batch_size: 16
max_train_steps: 200000
global_seed: 3407
num_workers: 6
log_every: 50
lr_warmup_steps: 0
resume_from_checkpoint:
gradient_accumulation_steps: 1

# low VRAM and speed up training
use_compile: False
mixed_precision: False
enable_xformers_memory_efficient_attention: False
gradient_checkpointing: False

project: adaptive_frequency_scheduler
