# dataset
dataset: "openvid"
csv_path: /scratch/s224075134/temporal_diffusion/datasets/video/OpenVid-0.4M/OpenVidHD_top200000.csv
latent_path: /scratch/s224075134/temporal_diffusion/datasets/video/OpenVid-0.4M/latents
prompt_latent_path: /scratch/s224075134/temporal_diffusion/datasets/video/OpenVid-0.4M/prompts_latents
drop_missing: True
return_tokens_if_available: False
load_latent: True

# save and load
results_dir: "./results_t2v"
pretrained_latte: maxin-cn/Latte-1 # LatteT2V ckpt
pretrained_model_path: maxin-cn/Latte-1
pretrained: /scratch/s224075134/temporal_diffusion/video-diffusion-model-v2/results_t2v/openvid512/001-FrameDiTHT2V-XL-256-2-F16S1-openvid512-ImageNetPretrained-Gc-Amp-512-loadlatent/checkpoints/0020000.pt

vae: "./configs/vae/lattet2v_autoencoder_kl.yaml"
tokenizer: "./configs/tokenizer/t5.yaml"

# model config: 
model: FrameDiTHT2V-XL/256-2
# model: LatteT2V
num_frames: 16
video_length: 16
image_size: [512, 512] # choices=[256, 512]
in_channels: 4
num_sampling_steps: 50
frame_interval: 1
#fixed_spatial: False
#attention_bias: True
learn_sigma: True
#extras: 2 # [1, 2] 1 unconditional generation, 2 class-conditional generation
attention_mode: math
resume_from_checkpoint:

# train config:
save_ceph: True # important
#use_image_num: 8
learning_rate: 3e-5
ckpt_every: 10000
clip_max_norm: 0.1
start_clip_iter: 100000
local_batch_size: 4 # important
max_train_steps: 1000000
global_seed: 3407
num_workers: 4
log_every: 50
lr_warmup_steps: 0
gradient_accumulation_steps: 4 # TODO

# low VRAM and speed up training
use_compile: True
mixed_precision_16bit: True
mixed_precision: False
enable_xformers_memory_efficient_attention: False
gradient_checkpointing: True

project: vdm

# For inference
beta_start: 0.0001
beta_end: 0.02
beta_schedule: "linear"
variance_type: "learned_range"
seed:
run_time: 0
guidance_scale: 7.5
sample_method: 'DDIM'
save_img_path: "./sample_videos/t2v-framedit-h"
enable_vae_temporal_decoder: False
enable_temporal_attentions: True # LatteT2V-V0: set to False; LatteT2V-V1: set to True
text_prompt: [
              'Yellow and black tropical fish dart through the sea.',
              'An epic tornado attacking above aglowing city at night.',
              'Slow pan upward of blazing oak fire in an indoor fireplace.',
              'a cat wearing sunglasses and working as a lifeguard at pool.',
              'Sunset over the sea.',
              'A dog in astronaut suit and sunglasses floating in space.',
              ]
