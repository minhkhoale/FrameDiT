# dataset
dataset: "taichi"

data_path: null
latent_path: "/scratch/s224075134/temporal_diffusion/datasets/video/taichi_latent_16_kl_f8_autoencoder/train"
load_latent: True

vae: "./configs/vae/autoencoder_kl.yaml"

# save and load
results_dir: "./results"
pretrained:
# model config: 
model: MatLatte-M/16-256/2
num_frames: 16
image_size: 128 # choices=[256, 512]
in_channels: 4
num_sampling_steps: 250
frame_interval: 3
fixed_spatial: False
attention_bias: True
learn_sigma: True
extras: 1 # [1, 2] 1 unconditional generation, 2 class-conditional generation

# train config:
load_from_ceph: False # important
learning_rate: 1e-4
ckpt_every: 10000
clip_max_norm: 0.1
start_clip_iter: 500000
local_batch_size: 5 # important
max_train_steps: 1000000
global_seed: 3407
num_workers: 8
log_every: 50
lr_warmup_steps: 0
resume_from_checkpoint:
gradient_accumulation_steps: 3 # TODO
num_classes:

# low VRAM and speed up training TODO
use_compile: False
mixed_precision: False
enable_xformers_memory_efficient_attention: False
gradient_checkpointing: False

# Wandb logger
project: vdm