# dataset
dataset: "dmlab"

data_path:
latent_path: /scratch/s224075134/temporal_diffusion/datasets/video/dmlab_latent_8_17035ae5/training
action_path: /scratch/s224075134/temporal_diffusion/datasets/video/dmlab/training
load_latent: True

vae: "./configs/vae/dmlab_dc_ae.yaml"

# save and load
results_dir: "./results_adaptive_schedule"
pretrained:

# model config:
model: LatteV2-B/1
num_frames: 16
image_size: 64
in_channels: 32
num_sampling_steps: 250
frame_interval: 1
fixed_spatial: False
attention_bias: True
learn_sigma: False
predict_xstart: True
extras: 3
num_classes: 4

# EqualSNR Fourier baseline with average-SNR calibration
diffusion_name: gaussian_diffusion
equal_snr: True
equal_snr_power_path: results_adaptive_schedule/dmlab64/adaptive_frequency_power_new/dataset_prior_frequency_stats.npz
equal_snr_power_scale: 1.0
equal_snr_power_exponent: 2.0
equal_snr_use_channelwise: True
equal_snr_calibrate_schedule: True

# train config:
load_from_ceph: False
learning_rate: 1e-4
ckpt_every: 10000
clip_max_norm: 0.1
start_clip_iter: 100000
local_batch_size: 8
max_train_steps: 500000
global_seed: 3407
num_workers: 8
log_every: 50
lr_warmup_steps: 0
resume_from_checkpoint:
gradient_accumulation_steps: 1

# low VRAM and speed up training
use_compile: True
mixed_precision: False
mixed_precision_16bit: True
enable_xformers_memory_efficient_attention: False
gradient_checkpointing: False

project: adaptive_frequency_scheduler
